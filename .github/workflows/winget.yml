name: Publish to WinGet

# Runs only for a published release that is not a prerelease.
# The first run fails until SebastianBecker.PowerPlanSwitcher exists in winget-pkgs.
# Repository secret WINGET_TOKEN: classic PAT with public_repo and workflow.

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-slim
    steps:
    - name: Publish to WinGet
      uses: vedantmgoyal9/winget-releaser@v2
      with:
        identifier: SebastianBecker.PowerPlanSwitcher
        installers-regex: '\.msi$'
        token: ${{ secrets.WINGET_TOKEN }}
