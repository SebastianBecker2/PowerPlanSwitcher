version: 1.0.{build}
image: Visual Studio 2022
configuration: Release

install:
- ps: |
    Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:TEMP\dotnet-install.ps1"
    & "$env:TEMP\dotnet-install.ps1" -Channel 10.0 -InstallDir "$env:ProgramFiles\dotnet"
- ps: nuget restore

before_build:
- ps: nuget restore

build_script:
- dotnet build PowerPlanSwitcher.sln --configuration Release -p:Platform=x64
- dotnet publish PowerPlanSwitcher/PowerPlanSwitcher.csproj --configuration Release -p:Platform=x64 --runtime win-x64 --self-contained false
- dotnet publish PowerPlanSwitcher.Cli/PowerPlanSwitcher.Cli.csproj --configuration Release -p:Platform=x64 --runtime win-x64 --self-contained false -o PowerPlanSwitcher/bin/publish
- dotnet build Setup/Setup.wixproj --configuration Release -p:Platform=x64

test_script:
- dotnet test RuleManagementTest/RuleManagementTest.csproj --configuration Release -p:Platform=x64 --no-build

after_build:
- dotnet pack PowerPlanSwitcher/PowerPlanSwitcher.csproj --configuration Release -p:Platform=x64 --include-symbols --output artifacts

artifacts:
- path: Setup/bin/x64/Release/PowerPlanSwitcher.msi
  name: PowerPlanSwitcherInstaller
- path: artifacts/*.nupkg
  name: PowerPlanSwitcherNuGet
